<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 助理上架審核原型</title>
<style>
:root{
  --primary:#1d63d6; --primary-weak:#e8f0fd; --bg:#f4f6fa; --card:#fff; --border:#e4e7ee;
  --text:#1f2329; --muted:#6b7280; --faint:#9aa1ad;
  --gray:#6b7280; --gray-bg:#f0f1f4;
  --orange:#c46a00; --orange-bg:#fff4e5;
  --red:#c9372c; --red-bg:#fdeceb;
  --green:#1a7f45; --green-bg:#e7f6ed;
  --purple:#6d4ad6; --purple-bg:#f0ebfd;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;height:calc(100vh - 40px);margin-top:40px}
/* header */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.12em;color:var(--primary);width:212px}
.logo i{width:26px;height:20px;border-radius:5px;background:linear-gradient(135deg,#1d63d6,#3fb0f0);display:inline-block}
.crumb{color:var(--muted)}
.spacer{flex:1}
.tl{border:none;background:none;color:#4b5563;padding:6px 8px;border-radius:6px;font-size:13.5px}
.tl:hover{background:var(--gray-bg)}
.tl.ai{color:var(--purple);font-weight:600}
.userbtn{display:flex;align-items:center;gap:8px;border:none;background:none;padding:4px 6px;border-radius:8px;text-align:left}
.userbtn:hover{background:var(--gray-bg)}
.u-txt{display:flex;flex-direction:column;line-height:1.2}
.u-txt .sub{font-size:12px}
.caret{margin-left:auto;color:var(--faint);font-size:12px;padding-left:6px}
.umenu{position:absolute;top:92px;right:16px;width:200px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.14);z-index:15;overflow:hidden}
.nav.inert{color:#8a919c}
.nav.grp{font-weight:500;color:var(--text);cursor:default}
.nav.grp.inert{color:#8a919c;cursor:pointer}
.newtag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:700;color:var(--purple);background:var(--purple-bg);border-radius:4px;padding:0 5px;vertical-align:middle}
.beta{margin-left:6px;font-size:10.5px;font-weight:700;color:#fff;background:var(--primary);border-radius:4px;padding:0 5px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{border:1px solid var(--border);border-radius:8px;padding:7px 10px;width:240px;background:#fff}
select.inp.sm{width:auto;padding:6px 8px}
.newfield{border-color:#c9b8f5!important;background:#faf8ff}
.tscroll{overflow-x:auto}
.toolbar input.search{width:260px;flex:none}
.atable .actions{flex-wrap:nowrap}
.atable .actions .btn{white-space:nowrap}
.btn.link.muted{color:var(--faint)}
.sec-h{font-size:16px;margin:0}
.atable{min-width:900px}
.th-sort{border:none;background:none;padding:0;font:inherit;color:inherit;font-weight:600;display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.th-sort span{color:#b7bdc8;font-size:12px}
.th-sort.on,.th-sort.on span{color:var(--primary)}
.atable th{white-space:nowrap}
.atable td:nth-child(1){min-width:150px}
.atable td:nth-child(2){min-width:180px}
@media (max-width:1100px){.tl{display:none}}
.star{border:none;background:none;font-size:18px;color:#c3c8d2;padding:0 2px;line-height:1}
.star.on{color:#f0a500}
.btn.on-toggle{border-color:#f0c25a;background:#fff8e6;color:#8a5a00}
.mono{font-family:ui-monospace,Menlo,monospace}
.acct{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.acct-side{background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px}
.acct-side .c-i{width:100%;border:none;background:none;text-align:left}
.create{display:grid;grid-template-columns:220px 1fr;gap:20px}
.c-side{border-right:1px solid var(--border);padding-right:12px}
.c-g{font-size:12px;color:var(--faint);margin:10px 0 4px}
.c-i{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px;font-size:13.5px}
.c-h{font-size:14px;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.c-main section+section{margin-top:22px}
.c-note{margin:20px 0 0}
button.c-i{width:100%;border:none;background:none;text-align:left;cursor:pointer;color:var(--text)}
button.c-i:hover{background:var(--gray-bg)}
.c-i.off{cursor:default}
.c-i.on{background:var(--primary-weak);color:var(--primary);font-weight:600}
.c-i.off{color:#8a919c}
.warnc{color:#d48806;font-size:12px}
.proto-tag{font-size:12px;color:var(--purple);background:var(--purple-bg);padding:2px 8px;border-radius:99px}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:4px 8px}
.who select{border:none;background:transparent;font-weight:600;outline:none}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.bell{position:relative;border:none;background:none;padding:6px;border-radius:8px}
.bell:hover{background:var(--gray-bg)}
.bell .dot{position:absolute;top:0;right:0;background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* sidebar */
.side{background:#fff;border-right:1px solid var(--border);padding:12px;overflow:auto}
.org{border:1px solid var(--border);border-radius:8px;padding:9px 12px;margin-bottom:12px;font-weight:500;display:flex}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:none;background:none;text-align:left;padding:9px 12px;border-radius:8px;color:var(--text)}
.nav:hover{background:var(--gray-bg)}
.nav.on{background:var(--primary-weak);color:var(--primary);font-weight:600}
.nav .cnt{margin-left:auto;background:var(--red);color:#fff;font-size:11px;border-radius:9px;padding:0 6px}
.nav-group{font-size:12px;color:var(--faint);padding:12px 12px 4px}
.nav.sub{padding-left:24px}
.nav-sep{height:1px;background:var(--border);margin:10px 4px}
/* main */
.main{overflow:auto;padding:24px 28px 32px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;min-height:36px}
.page-h h1{font-size:20px;margin:0}
.page-h p{margin:0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
.card+.card{margin-top:16px}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fb;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top}
tr.row:hover td{background:#fafbfd;cursor:pointer}
.name{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-draft{color:var(--gray);background:var(--gray-bg)}
.b-pending{color:var(--orange);background:var(--orange-bg)}
.b-rejected{color:var(--red);background:var(--red-bg)}
.b-approved{color:var(--green);background:var(--green-bg)}
.b-acting{color:var(--purple);background:var(--purple-bg)}
.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:6px 14px;color:var(--text)}
.btn:hover{border-color:#c9cfdb}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:#1755bb}
.btn.danger{color:var(--red);border-color:#f0c4c0}
.name-link{border:none;background:none;padding:0;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
.name-link:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
tr.row:hover .name-link{color:var(--primary)}
.agent-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:stretch}
.agent-grid .card+.card{margin-top:16px}
.sec-gap{margin-top:22px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;margin-top:4px}
.fgrid .span2{grid-column:1/-1}
.fgrid label.f{margin-top:12px}
.ro{padding:8px 0;color:var(--text)}
.f-foot{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
.test-panel{display:flex;flex-direction:column;min-height:420px;padding:0;overflow:hidden;margin-top:0!important;position:sticky;top:0;align-self:start;height:calc(100vh - 144px)}
.tp-h{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-bottom:1px solid var(--border)}
.test-panel .log-wrap{position:relative;flex:1}
.test-panel .log{position:absolute;inset:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafbfd}
.agent-h{margin-bottom:12px}
.tab-stack{display:grid}
.tab-pane{grid-area:1/1}
.tab-pane:not(.on){visibility:hidden;pointer-events:none}
.agent-h .ic{width:32px;height:32px;border-radius:8px;font-size:14px}
.agent-h h1{font-size:19px}
.agent-h .sub{margin:2px 0 0}
.id-line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.copy{border:none;background:none;color:var(--faint);cursor:pointer;padding:0 4px;font-size:13px;border-radius:4px}
.copy:hover{color:var(--primary);background:var(--primary-weak)}
.back{border:none;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px;cursor:pointer}
.back:hover{background:var(--gray-bg);color:var(--text)}
.locked input:disabled,.locked select:disabled,.locked textarea:disabled{pointer-events:none}
.locked section{cursor:not-allowed}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,163,61,.55)}100%{box-shadow:0 0 0 10px rgba(232,163,61,0)}}
.banner.pulse,.btn.pulse{animation:pulse .9s ease-out 2}
.banner-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.banner.tight{padding:8px 12px;margin-bottom:12px}
.opt{font-size:12px;font-weight:400;color:var(--faint);margin-left:4px}
.dirty-bar{position:sticky;bottom:16px;display:flex;align-items:center;gap:8px;margin:20px 0 0;padding:10px 12px 10px 14px;background:#fff;border:1px solid #efd29c;border-radius:12px;box-shadow:0 10px 28px rgba(31,35,41,.16);color:#7a4300;font-weight:600;font-size:13.5px;z-index:2}
.dirty-bar>span:first-child::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#e8a33d;margin-right:8px;vertical-align:middle}
.dirty-bar[hidden],.dirty-note[hidden]{display:none}
.dirty-note{background:#fff8e6;color:#7a4300;font-size:12.5px;padding:6px 14px;border-bottom:1px solid #f0d49a}
.prompt-box{white-space:pre-wrap;background:#f6f7f9;border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:120px;overflow:auto;font-size:13px}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner.info{background:var(--primary-weak);color:#24447a}
.banner.warn{background:var(--orange-bg);color:#7a4300}
.banner.bad{background:var(--red-bg);color:#8a2219}
.banner.good{background:var(--green-bg);color:#14532d}
input:disabled,select:disabled,textarea:disabled{background:#f6f7f9;color:#4b5563}
.btn.link.sm{font-size:12.5px;padding:2px 0}
.btn.link{border:none;background:none;color:var(--primary);padding:6px 4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.info{background:var(--primary-weak);border-radius:8px;padding:10px 14px;color:#24447a;font-size:13px}
.warn{background:var(--orange-bg);border-radius:8px;padding:10px 14px;color:#7a4300;font-size:13px}
.empty{text-align:center;color:var(--faint);padding:40px 0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{border:none;background:none;padding:8px 14px;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
/* review items */
.ritem{display:flex;gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.ritem:last-child{border-bottom:none}
.ritem .grow{flex:1}
/* market */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.acard{border:1px solid var(--border);border-radius:12px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:8px}
.page-h .ic,.acard .ic{width:38px;height:38px;border-radius:10px;background:var(--primary-weak);display:grid;place-items:center;color:var(--primary);font-weight:700}
/* modal/drawer */
.mask{position:fixed;inset:0;background:rgba(20,24,32,.42);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{width:min(920px,100%)}
.m-h{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.reject-box{margin-top:16px;border:1px solid #f0c4c0;background:#fff7f6;border-radius:10px;padding:12px 14px}
.rb-h{font-weight:700;color:var(--red);margin-bottom:2px}
.req{font-size:11.5px;font-weight:600;color:#fff;background:var(--red);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:middle}
.reject-box textarea{background:#fff}
.reject-box .chip{background:#fff}
.btn.danger-fill{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-fill:hover{background:#ad2c22}
.m-sub{font-size:13px;font-weight:400;color:var(--muted);margin-top:2px}
.m-h .icon-btn{font-size:15px;flex:none}
.m-b{padding:20px;overflow:auto;flex:1 1 auto;min-height:0}
.m-h,.m-f{flex:none}
.modal.scrolly .m-f{box-shadow:0 -8px 14px -10px rgba(0,0,0,.25)}
.m-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.drawer-mask{position:fixed;inset:0;background:rgba(20,24,32,.3);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:#fff;width:min(460px,100%);height:100%;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12)}
label.f{display:block;font-weight:600;margin:14px 0 6px}
textarea,input[type=text],input[type=date],select.inp{width:100%;border:1px solid var(--border);border-radius:8px;padding:8px 10px;outline:none}
textarea:focus,input:focus,select.inp:focus{border-color:var(--primary)}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{position:relative;padding:0 0 14px 22px}
.timeline li:before{content:"";position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--primary)}
.timeline li:after{content:"";position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--border)}
.timeline li:last-child:after{display:none}
.timeline .t{color:var(--faint);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--border);background:#fff;border-radius:99px;padding:3px 10px;font-size:12.5px}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
.chat{border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;height:300px}
.chat .log{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fafbfd;border-radius:10px 10px 0 0}
.msg{max-width:85%;padding:7px 11px;border-radius:10px;font-size:13px}
.msg.u{align-self:flex-end;background:var(--primary);color:#fff}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--border)}
.chat form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
/* notifications */
.npanel{position:absolute;top:92px;right:180px;width:360px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.14);z-index:15}
.npanel .nh{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--border)}
.nitem{display:block;width:100%;text-align:left;border:none;background:#fff;padding:12px 16px;border-bottom:1px solid var(--border)}
.nitem:hover{background:#fafbfd}
.nitem.unread{background:#f5f9ff}
.nitem .t{color:var(--faint);font-size:12px}
/* guide & scenario */
.guide{position:fixed;left:16px;bottom:16px;width:300px;background:rgba(31,42,68,.8);transition:background .15s;color:#e8edf7;border-radius:12px;padding:12px 14px;font-size:13px;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.guide.min{width:auto;padding:8px 12px}
.g-h{display:flex;align-items:center;gap:8px}
.g-prog{font-size:12px;opacity:.75}
.g-x{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px;white-space:nowrap;flex:none}
.g-bar{height:4px;background:rgba(255,255,255,.15);border-radius:2px;margin:8px 0 10px;overflow:hidden}
.g-bar i{display:block;height:100%;background:#ffb020}
.g-ch{font-size:12px;color:#b9c6e0}
.g-t{font-weight:700;font-size:14px;margin:2px 0 4px;color:#fff}
.g-d{line-height:1.6}
.g-a{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.name-link{border:none;background:none;padding:0;font-weight:600;color:var(--text);text-align:left;cursor:pointer}
.name-link:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
tr.row:hover .name-link{color:var(--primary)}
.agent-h{margin-bottom:12px}
.agent-h .ic{width:32px;height:32px;border-radius:8px;font-size:14px}
.agent-h h1{font-size:19px}
.agent-h .sub{margin:2px 0 0}
.id-line{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.copy{border:none;background:none;color:var(--faint);cursor:pointer;padding:0 4px;font-size:13px;border-radius:4px}
.copy:hover{color:var(--primary);background:var(--primary-weak)}
.back{border:none;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px;border-radius:6px;cursor:pointer}
.back:hover{background:var(--gray-bg);color:var(--text)}
.locked input:disabled,.locked select:disabled,.locked textarea:disabled{pointer-events:none}
.locked section{cursor:not-allowed}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(232,163,61,.55)}100%{box-shadow:0 0 0 10px rgba(232,163,61,0)}}
.banner.pulse,.btn.pulse{animation:pulse .9s ease-out 2}
.banner-row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.banner.tight{padding:8px 12px;margin-bottom:12px}
.opt{font-size:12px;font-weight:400;color:var(--faint);margin-left:4px}
.dirty-bar{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;margin:16px -20px -20px;padding:10px 20px;background:#fff8e6;border-top:1px solid #f0d49a;border-radius:0 0 12px 12px;color:#7a4300;font-weight:600;font-size:13.5px;z-index:2}
.dirty-bar[hidden],.dirty-note[hidden]{display:none}
.dirty-note{background:#fff8e6;color:#7a4300;font-size:12.5px;padding:6px 14px;border-bottom:1px solid #f0d49a}
.prompt-box{white-space:pre-wrap;background:#f6f7f9;border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:120px;overflow:auto;font-size:13px}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.banner.info{background:var(--primary-weak);color:#24447a}
.banner.warn{background:var(--orange-bg);color:#7a4300}
.banner.bad{background:var(--red-bg);color:#8a2219}
.banner.good{background:var(--green-bg);color:#14532d}
input:disabled,select:disabled,textarea:disabled{background:#f6f7f9;color:#4b5563}
.btn.link.sm{font-size:12.5px;padding:2px 0}

  </div>
  <div class="card"><h2>取捨理由</h2><ol>
    <li><b>核准＝系統自動完成手冊裡的上架動作。</b>平台的可見性只看「AI 助理綁到哪個角色」，所以不另外做一套權限。核准後系統照手冊建議的做法自動完成上架：複製一份上架版、綁定部門角色、只開讀取。改動最小，也不會跟現有的角色設定衝突；上架後如何改版不在本題範圍。</li>
    <li><b>「建立」和「送出」分開，建立視窗不放「直接送出審核」。</b>按鈕寫「建立草稿」，建立後直接進入該 AI 助理頁，右側就是測試對話，可以邊調邊測，確認後再「送出審核」。剛建立時只有基本資料、還沒測試，直接送審多半會被退回，徒增主管負擔；三個按鈕也會讓每次建立都多一個沒有意義的選擇。AI 助理通常要反覆調整知識庫和回答方式，不該一建立就進入審核。</li>
    <li><b>草稿只有建立者看得到，送出後加上部門主管。</b>平台現在要靠「一人一個角色」做到，而且建構者不能隸屬部門角色，代價是建構者看不到部門的正式 AI 助理（手冊列為已知代價）。改由系統規則處理後，組員可以照常留在部門角色裡、使用部門的 AI 助理，半成品也不會被同事拿去用。</li>
    <li><b>審核中鎖定編輯，但可以撤回。</b>確保主管核准的版本就是上架的版本。想再改就先撤回，比偷偷修改更清楚。</li>
    <li><b>建立者在草稿階段就能測試，測試次數讓主管看到。</b>AI 助理頁右側常駐測試對話（沿用平台 Agent 頁的測試對話），改完設定馬上能問一句看效果，標示「只有你看得到」。送出時若還沒測試過，會提醒先測試；主管的審核視窗也會顯示「建立者測試 N 次」，作為判斷的參考。這是用提醒而不是強制，避免卡住真的很簡單的 AI 助理。</li>
    <li><b>設定加入「角色指令」，主管審核時也看得到。</b>AI 助理怎麼回答主要由角色指令（prompt）決定。建立後在 AI 助理頁調整角色指令、儲存、在右側測試，形成「改 → 測 → 再改」的循環；審核中鎖定。主管的審核視窗顯示完整角色指令，因為語氣、能不能承諾交期或賠償，正是最容易出問題、主管最該把關的地方。建立視窗也有這個欄位但標示「選填」：已經想好的人可以直接填，還沒想好的人建立後再一邊測試一邊調整；建立與編輯的欄位一致，使用者不會疑惑欄位去哪了。編輯頁不用「編輯模式」：這頁的主要任務就是反覆修改，而且改了要儲存才生效，誤觸代價低（跟第一題權限勾了立即生效不同）。真正要防的是「改了沒存」：一改欄位，卡片底部就浮出固定的「有未儲存的變更［捨棄變更］［儲存變更］」；測試對話提醒「目前測試的是已儲存的版本」；未儲存就送審會先要求「儲存並送出」，確保主管審到最新版本。上架後再修改屬於改版，不在本題範圍。</li>
    <li><b>主管可以直接測試。</b>AI 助理好不好要用過才知道，只看設定欄位判斷不了；送出時組員也可以附上測試說明，減少來回。</li>
    <li><b>建立時選「開放對象」，取代平台原本的「權限設定」。</b>平台現在的建立視窗裡，「管理與進階 › 權限設定」提供「全部角色／排除預設角色／自訂選擇角色」三種範圍，建立者按下確認就直接生效，等於可以不經核准就開放給整個部門、甚至全組織（手冊因此要求建構者不能隸屬部門角色）。平台建立後的設定頁也一樣，建立者可以隨時把角色從「可選角色」移到「已選角色」並儲存，同樣不經核准。原型把它改成「開放對象」，建立與編輯時都不讓建立者自己分配角色：選項只列出自己隸屬的部門，而且<b>選了不會立刻生效</b>，要主管核准後才開放；其他部門或全公司不在選項內，需另外申請。組員一開始就知道做好會給誰用，送出審核時再確認一次。</li>
    <li><b>主管不能調整「核准後誰可以用」。</b>規則是「組員做的東西，主管核准後給部門用」，所以範圍固定為建立者的部門、只開讀取。讓主管自己挑範圍，等於把權限設定交給每位主管，容易越開越大，也碰到題目排除的「其他權限」。要開放給其他部門或全公司，應該是另一層申請（手冊的「全公司級」上架），不在本題一層核准的範圍。主管若覺得範圍不對，可以退回並說明。</li>
    <li><b>核准一鍵，退回是有意識的第二步。</b>審核視窗只有一個主要按鈕「核准並上架」；按「退回」才展開退回區塊（淡紅底、必填標示、常用原因快選），再按「確認退回」。退回原因不會在核准時佔版面，也避免主管誤按就退回。測試對話的「送出」改成次要按鈕，不跟「核准並上架」搶注意力。</li>
    <li><b>退回必填原因，提供常用原因快選。</b>組員知道要改什麼；主管不用每次從頭打字。</li>
    <li><b>主管不在或沒空：代理人優先，逾期改派給部門其他管理職。</b>參考一般企業簽核的做法，分三層：第一層，<b>事先排休</b>時在排休視窗選代理人：選單列出部門所有成員，但只有管理職可以選，一般組員不能代理，避免組員互審；第二層，<b>主管在但沒空</b>，可以在審核視窗按「轉交審核」，選部門裡的其他管理職；第三層，<b>臨時病假、來不及處理</b>，靠時限保底：第 2 個工作天提醒主管、第 4 天同時通知主管和建立者「明天逾期將改派給誰」、第 5 天系統依「部門管理職名單」的順序改派（先副理、再組長），不受排休時選的代理人影響，三方都會收到通知。改派對象留在業務部門，因為系統管理員不懂業務內容，不該替部門判斷 AI 助理能不能上架；系統管理員只處理例外（例如代理人自己送出的項目）。AI 助理上架不是急件，所以時限用一週而不是兩天，避免主管只是出差幾天就被系統架空。</li>
    <li><b>主管排休沿用平台既有的「我的排休」，放在「帳號」頁。</b>平台的真人客服已經有「我的排休」：設定休假區間，期間內不派工，結束後自動恢復，狀態顯示「排休中（至結束時間）」。審核代理沿用同樣的用詞和行為，只多一個「代理人」欄位，並列出交接事項。位置放在右上角頭像 › 帳號 › 目前組織，因為代理人只在目前組織有效，跟同一組的 Credit 額度、API 金鑰一樣屬於「我在這個組織的設定」。用期間而不用開關，是因為排休通常事先安排，到期自動恢復就不必記得關掉；臨時提早回來可以「提前結束排休」。若公司的請假系統可以串接，排休期間可自動帶入。</li>
    <li><b>狀態透明。</b>組員隨時看得到卡在誰手上、等了幾天，不必私下去問；每一步都記錄是誰、是否代理。</li>
    <li><b>個人通知與公告分開。</b>現有通知中心只有系統公告和組織公告，審核需要的是「給特定人」的通知，所以另外放在鈴鐺的「個人通知」分頁。</li>
    <li><b>「編輯」與「審核紀錄」整合成一個 AI 助理頁。</b>對組員來說，設定和審核紀錄是同一個 AI 助理的兩面，不該拆成兩個入口。列表點整列進入 AI 助理頁（延伸平台既有的設定頁），頂部狀態列說明現況和下一步。左邊用分頁切換「設定」與「審核紀錄」，右邊是常駐的測試對話；標題列、狀態列與右上角的主要按鈕固定在頂部，捲到哪裡都看得到下一步。審核中與已上架時設定鎖定為唯讀，狀態列直接說明原因，讓「審核中鎖定編輯」這條規則看得見。列表每列只留一個依狀態決定的按鈕（送出審核、撤回、修改、開始對話）。整列只有一個目的地，點偏了也只是進入 AI 助理頁，不會誤觸動作；點擊範圍大，對每天處理很多事的業助更快。</li>
    <li><b>列表只依「最後更新」排序，預設新到舊。</b>組員自己的列表筆數不多，排序的用處是把有變化的放到最上面：剛被退回、剛核准的會浮到最上面，一打開就看得到。名稱、狀態等欄位先不加排序，狀態已有篩選可用；之後項目變多再評估。</li>
    <li><b>列表的 ID 移到名稱下方。</b>業務人員靠名稱找 AI 助理，ID 只在回報問題或跟系統管理員溝通時才用得到。把 ID 縮成名稱下方的小字，名稱變成第一欄，狀態緊接在旁邊，視線從左到右就是「哪一個 → 現在怎樣」。這是對平台既有列表的小調整，搜尋框仍可用 ID 搜尋。</li>
    <li><b>設定只保留審核者判斷需要的欄位。</b>實際的 AI 助理設定還有頭像、開場白、建議問題、工具串接等十幾項，但這題考的是「送出到同事看到」的流程，所以只留主管審核時要看的：用途說明（做什麼）、角色指令（怎麼回答）、知識庫（讀得到哪些資料，最大的外洩風險）、開放對象（給誰用）、模型與回答模式（成本與行為），加上名稱。其他設定沿用平台現有的設定頁，不在本題範圍。</li>
    <li><b>建立視窗不放平台的設定分類選單。</b>平台的 AI 助理設定有十幾項，才需要左側分類導覽；這題只有上述幾個欄位。保留導覽會讓一半是灰色不能用的項目，反而搶走「用途說明」「開放對象」這兩個跟審核有關的重點。右側區塊標題沿用平台的分類名稱，並註明其他設定沿用平台。</li>
    <li><b>介面上一律寫「AI 助理」，不單寫「助理」。</b>製造業裡的「助理」通常指業務助理（人），寫成「助理會鎖定」容易被誤會成某位同事；提到特定項目時直接寫出名稱，例如「客訴回覆助理」。</li>
  </ol>
  <h3>觀察到、但刻意不改的平台問題</h3><ul>
    <li><b>Agent 市集的「檢視最愛」只在「組織自建」分頁。</b>最愛是使用者自己的清單，使用者不會先想「它是官方還是自建」，最愛應該跨來源、放在分頁的上一層。但這是市集既有的資訊架構，跟本題的核准流程無關，改它會偏離「參考平台架構」，所以原型不放最愛功能，建議另案處理。</li>
  </ul>
  <h3>假設與不在範圍內</h3><ul>
    <li>每個部門角色已標記一位主管（題目說明已設定好，本原型不設計設定方式）。</li>
    <li>每個部門也已標記哪些人是「管理職」（例如副理、組長），可以擔任代理人或被轉交、改派；名單的順序就是逾期改派的順序，跟排休時選誰當代理人無關。跟主管一樣由系統管理員在部門角色設定，不涉及上下級關係，本原型不設計設定方式。</li>
    <li>只有一層核准；改版後是否重新核准、多層簽核、部門與上下級設定不在本題範圍。</li>
    <li>第 2／4／5 個工作天的提醒、預告與改派時限為初始值，實際應依公司審核習慣調整。</li>
    <li>知識庫由平台既有的「知識庫」頁面建立與管理；建立 AI 助理時的選單只列出組員已有權限使用的知識庫，找不到時從選單底部「前往新增知識庫」過去。知識庫本身的權限與審核屬於「其他權限」，不在本題範圍。</li>
    <li>Agent 市集的「開始對話」在原型以懸浮視窗示意，可同時開多個 AI 助理並用分頁切換；實際沿用平台既有的對話功能，對話會保存在對話清單，來源標示為「內部」。</li>
  </ul></div>
  </div>`;
}

/* ---------- 視窗 ---------- */
function mh(title,sub='',extra=''){return `<div class="m-h"><div style="flex:1;min-width:0"><div>${title}</div>${sub?`<div class="m-sub">${sub}</div>`:''}</div>${extra}<button class="icon-btn" data-act="close" aria-label="關閉">✕</button></div>`}
function mConfirm(){
  const m=UI.modal;
  return `<div class="mask" data-act="close"><div class="modal" style="width:min(440px,100%)">
    ${mh(esc(m.title))}
    <div class="m-b">${esc(m.text)}</div>
    <div class="m-f"><button class="btn" data-act="close">取消</button><button class="btn ${m.danger?'danger-fill':'primary'}" data-act="${m.then}">${esc(m.ok)}</button></div>
  </div></div>`;
}
function mCreate(){
  return `<div class="mask" data-act="close"><div class="modal">
    ${mh('建立 AI 助理')}
    <div class="m-b">
      <div class="c-main" id="c-main">
        <section id="sec-basic"><h4 class="c-h">基本設定</h4>
          <label class="f" style="margin-top:0"><span style="color:var(--red)">*</span> 名稱</label><input type="text" id="cr-name" placeholder="請輸入" value="${prefillCreate()?DEMO_A.name:''}">
          <label class="f"><span style="color:var(--red)">*</span> LLM 模型</label><select class="inp" id="cr-model"><option>GPT-5.6 Luna</option><option>Claude Sonnet 5.5</option><option>Gemini 3 Pro</option></select>
          <label class="f"><span style="color:var(--red)">*</span> 用途說明</label><input type="text" id="cr-desc" placeholder="這個 AI 助理幫同事做什麼（審核時給主管看）" value="${prefillCreate()?DEMO_A.desc:''}">
        </section>
        <section id="sec-mode"><h4 class="c-h">回答模式設定</h4>
          <label class="f" style="margin-top:0"><span style="color:var(--red)">*</span> 回答模式 ${MODE_HELP}</label><select class="inp" id="cr-mode">${MODES.map(m=>`<option>${m}</option>`).join('')}</select>
        </section>
        <section id="sec-prompt"><h4 class="c-h">角色指令 <span class="opt">選填</span></h4>
          <textarea id="cr-prompt" rows="3" placeholder="告訴 AI 助理它是誰、要怎麼回答、哪些事不能做。還沒想好可以先空著，建立後一邊測試一邊調整。">${prefillCreate()?esc(DEMO_A.prompt):''}</textarea>
        </section>
        <section id="sec-kb"><h4 class="c-h">知識庫設定</h4>
          <label class="f" style="margin-top:0"><span style="color:var(--red)">*</span> 知識庫 <span class="opt">可選多個</span></label>${kbPicker('cr',UI.crKb||[],false)}
        </section>
        <section id="sec-scope"><h4 class="c-h">開放對象</h4>
          <label class="f" style="margin-top:0" for="cr-scope"><span style="color:var(--red)">*</span> 開放範圍</label><select class="inp" id="cr-scope"><option value="dept" selected>${DEPT.name}（部門全體，僅讀取）</option><option disabled>全公司（需另外申請）</option></select>
          <div class="sub" style="margin-top:4px">送出審核後主管才看得到；核准後系統會把這個 AI 助理分配給「${DEPT.name}」角色（僅讀取），部門同事就能使用。</div>
        </section>
        <p class="sub c-note">頭像、開場白、工具、對話平台等其他設定沿用平台現有的設定頁，原型省略。</p>
      </div>
    </div>
    <div class="m-f"><span class="sub" style="margin-right:auto">建立後可以先調整、測試，再送出審核</span><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="doCreate">建立草稿</button></div>
  </div></div>`;
}
function mLeave(){
  const L={...(S.leave||{from:isoDay(),to:isoDay(6)})};L.delegate=L.delegate||REVIEWERS[0];
  return `<div class="mask" data-act="close"><div class="modal">
    ${mh(S.leave?'修改排休':'新增排休')}
    <div class="m-b">
      <div class="row-flex">
        <div style="flex:1"><label class="f" style="margin-top:0"><span style="color:var(--red)">*</span> 開始</label><input type="date" id="lv-from" value="${L.from}"></div>
        <div style="flex:1"><label class="f" style="margin-top:0"><span style="color:var(--red)">*</span> 結束</label><input type="date" id="lv-to" value="${L.to}"></div>
      </div>
      <label class="f" for="lv-del"><span style="color:var(--red)">*</span> 代理人</label>
      <select class="inp" id="lv-del">${DEPT_MEMBERS.filter(p=>p!=='manager').map(p=>{const ok=REVIEWERS.includes(p);return `<option value="${p}" ${ok?'':'disabled'} ${L.delegate===p?'selected':''}>${P(p).name}（${P(p).role}）${ok?'':'・組員不能擔任代理人'}</option>`}).join('')}</select>
      <div class="info" style="margin-top:12px">代理人只處理你的待辦，不處理他自己提出的項目（改由系統管理員處理）；排休結束自動收回權限。</div>
    </div>
    <div class="m-f"><button class="btn" data-act="close">取消</button><button class="btn primary" data-act="doLeave">儲存</button></div>
  </div></div>`;
}
function mSubmit(a){
  return `<div class="mask" data-act="close"><div class="modal">
    ${mh('送出審核',esc(a.name))}
    <div class="m-b">
      <dl class="kv">
        <dt>審核人</dt><dd>${(()=>{const t={...a,status:'pending'};const r=reviewerOf(t);return esc(nm(r.id))+(r.acting?'（代理林經理）':'')})()}</dd>
        <dt>審核時限</dt><dd>${EXPIRE} 個工作天<div class="sub">第 ${REMIND} 天提醒審核人；第 ${WARN} 天會先通知你和審核人；逾期由系統改派給部門其他管理職</div></dd>
        <dt>開放對象</dt><dd>全${DEPT.name}（僅讀取）・主管核准後生效</dd>

    case 'doSubmit':A.submit(id,document.getElementById('sub-note').value.trim());UI.modal=null;break;
    case 'withdraw':A.withdraw(id);UI.drawer=null;if(S.view==='agent')UI.atab='settings';break;
    case 'openReview':UI.modal={type:'review',id:+id};UI.chat=[];UI.rejecting=false;break;
    case 'chip':{const t=document.getElementById('rej-reason');t.value=t.value.trim()?t.value.trim()+'；'+v:v;t.focus();markTarget();return}
    case 'startReject':UI.rejecting=true;UI.rejText='';render();document.getElementById('rej-reason')?.focus({preventScroll:true});document.querySelector('.reject-box')?.scrollIntoView({block:'end'});fitModal();return;
    case 'cancelReject':UI.rejecting=false;break;
    case 'doApprove':A.approve(id);UI.modal=null;UI.chat=[];UI.rtab='done';UI.flashId=+id;break;
    case 'doReject':{const r=document.getElementById('rej-reason');if(!r.value.trim()){r.focus();r.style.borderColor='var(--red)';r.placeholder='請填寫退回原因，讓建立者知道要改什麼';return}A.reject(id,r.value.trim());UI.modal=null;UI.rtab='done';UI.flashId=+id;UI.chat=[];UI.rejecting=false;break}
    case 'openCreate':UI.modal={type:'create'};UI.crKb=prefillCreate()?[...DEMO_A.kb]:[];UI.sec='sec-basic';break;
    case 'doCreate':{const miss=['cr-name','cr-desc'].filter(id=>!document.getElementById(id).value.trim());const noKb=!(UI.crKb||[]).length;
      if(miss.length||noKb){toast(miss.length?'請填寫必填欄位':'請至少選擇一個知識庫');UI._keepDrafts=true;render();
        miss.forEach(id=>document.getElementById(id).style.borderColor='var(--red)');const kbBox=document.querySelector('#cr-kbp .kb-trigger');if(noKb&&kbBox)kbBox.style.borderColor='var(--red)';
        const f=miss[0]?document.getElementById(miss[0]):kbBox;f?.scrollIntoView({block:'center'});f?.focus();return}setTimeout(()=>document.getElementById('t-in')?.focus(),0);const n=document.getElementById('cr-name');A.create(n.value.trim(),document.getElementById('cr-desc').value.trim(),document.getElementById('cr-model').value,UI.crKb.join('、'),document.getElementById('cr-prompt').value.trim(),document.getElementById('cr-mode').value);UI.modal=null;break}
    case 'openLeave':UI.modal={type:'leave'};break;
    case 'doLeave':{const f=document.getElementById('lv-from').value,t=document.getElementById('lv-to').value;if(!f||!t||t<f){toast('請確認排休期間');return}A.setLeave(f,t,document.getElementById('lv-del').value);UI.modal=null;break}
    case 'endLeave':UI.modal=activeLeave()?{type:'confirm',title:'提前結束排休',text:'結束後，待辦會回到你手上，代理人的權限也會收回。',ok:'結束排休',then:'doEndLeave'}:{type:'confirm',title:'取消排休',text:'取消後，這段排休與代理人設定會刪除。',ok:'取消排休',then:'doEndLeave'};break;
    case 'doEndLeave':UI.modal=null;A.endLeave();break;
    case 'ff':A.fastForward();break;
    case 'openHandoff':UI.modal={type:'handoff',id:+id};break;
    case 'backReview':UI.modal={type:'review',id:+id};break;
    case 'handoff':A.handoff(id,document.getElementById('ho-to').value);UI.modal=null;UI.chat=[];break;
    case 'reset':UI.modal={type:'confirm',title:'重設原型',text:'會回到開始畫面，你建立的 AI 助理、排休設定和通知都會清除。',ok:'重設',danger:true,then:'doReset'};UI.notif=false;UI.umenu=false;break;
    case 'doReset':startScenario('A');S.tour.min=false;S.tour.started=false;UI.modal=null;UI.drawer=null;UI.float=null;UI.tchat=null;UI.edit=null;UI.rtab='todo';UI.atab='settings';UI.filter='';UI.aq='';toast('已重設');break;
    case 'toast':toast(el.dataset.msg);break;
    case 'who':case 'chat':case 'tchat':case 'fchat':case 'filter':return; // 表單本身不是按鈕：點輸入框或送出鈕時不能重繪，否則送出會被打斷
  }
  render();
});
function markDirty(el){
  const f={'ed-name':'name','ed-desc':'desc','ed-prompt':'prompt','ed-kb':'kb','ed-scope':'scope','ed-mode':'mode'}[el.id];if(!f)return;
  if(!UI.edit||UI.edit.id!==S.agentId)UI.edit={id:S.agentId,v:{}};
  UI.edit.v[f]=el.value;
  ['dirty-bar','dirty-note'].forEach(id=>{const x=document.getElementById(id);if(x)x.hidden=false});
  markTarget();
}
document.addEventListener('input',e=>{
  if(e.target.id==='rej-reason')markTarget();
  if(e.target.id&&e.target.id.startsWith('ed-')){markDirty(e.target);return}
  const id=e.target.id;if(id!=='mq'&&id!=='aq')return;
  UI[id]=e.target.value;const pos=e.target.selectionStart;render();
  const el=document.getElementById(id);if(el){el.focus();el.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{
  const t=e.target.closest&&e.target.closest('.kb-trigger[data-act]');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();t.click()}
  if(e.key==='Escape')document.querySelectorAll('.kbp.open').forEach(x=>x.classList.remove('open'));
});
document.addEventListener('scroll',e=>{placeTip();const m=e.target;if(m.classList&&m.classList.contains('m-b')){fitModal();return}if(m.classList&&m.classList.contains('main')){const ah=m.querySelector('.agent-top');if(ah)ah.classList.toggle('stuck',m.scrollTop>4)}},true);
// 視窗內容太長時：標題與按鈕列固定，只捲中間；底部加陰影提示還有內容
// 換身分時在畫面中央短暫顯示「現在是誰」，避免展示時沒注意到已經換人
let lastMe=null,cueT;
function roleSwitchCue(){
  // 開啟原型、切換情境或重設時，第一步也要顯示目前身分
  if(!S.tour.started){lastMe=null;return}
  const force=UI._forceCue||(lastMe===null&&!S.tour.min);UI._forceCue=false;
  if(!force&&(lastMe===null||lastMe===S.me)){lastMe=S.me;return}
  lastMe=S.me;
  document.getElementById('role-cue')?.remove();clearTimeout(cueT);
  // 同一個動作同時有提示訊息時，併進身分卡片，避免畫面上兩個地方都要看
  let msg='';if(UI.toast&&Date.now()-(UI.toastAt||0)<400){msg=UI.toast;UI.toast=null;clearTimeout(tt);document.querySelector('#root .toast')?.remove()}
  const p=P(S.me),d=document.createElement('div');d.id='role-cue';d.className='role-cue';d.setAttribute('role','status');
  d.innerHTML=`<div class="rc-card"><span class="avatar rc-av" style="background:${p.color}">${esc(p.name[0])}</span><div>${msg?`<div class="rc-msg">${esc(msg)}</div>`:''}<div class="rc-k">${msg?'目前身分':'切換身分'}</div><div class="rc-n">${esc(p.name)}<span>（${esc(WHO_LABEL[S.me])}）</span></div><div class="rc-d">${esc(DEPT_OF[S.me]||'')}・接下來以${esc(p.name)}的畫面操作</div></div></div>`;
  d.addEventListener('click',()=>d.remove());document.body.appendChild(d);
  cueT=setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),300)},3000);
}
function fitModal(){document.querySelectorAll('.modal').forEach(m=>{const b=m.querySelector('.m-b');if(b)m.classList.toggle('scrolly',b.scrollHeight-b.scrollTop>b.clientHeight+2)})}
function fitAgentPage(){const top=document.querySelector('.agent-top'),tp=document.querySelector('.test-panel'),mn=document.querySelector('.main');
  if(!top||!tp||!mn)return;if(getComputedStyle(tp).position!=='sticky'){tp.style.top='';tp.style.height='';return}
  const h=top.offsetHeight-24;tp.style.top=h+'px';tp.style.height=Math.max(360,mn.clientHeight-h-56)+'px'}
window.addEventListener('resize',()=>{fitAgentPage();fitModal();placeTip()});
document.addEventListener('change',e=>{
  if(e.target.id==='lv-del'&&e.target.value!=='deputy'&&!S.tour.min&&curScen().id==='C'&&!activeLeave()){e.target.value='deputy';nudge('示範流程請選王副理（實際可以選任何管理職）');return}
  if(e.target.id==='scen-sel'){startScenario(e.target.value);toast(`已切換到情境${curScen().name}，資料已準備好`);render();return}
  if(e.target.classList.contains('kb-cb')){const p=e.target.dataset.p;setKb(p,[...document.querySelectorAll(`#${p}-kbp .kb-cb:checked`)].map(c=>c.value));return}
  if(e.target.id&&e.target.id.startsWith('ed-')){markDirty(e.target)}
  if(e.target.dataset.act==='who'){S.me=e.target.value;S.view=myQueue().length?'review':HOME[S.me];UI.notif=false;UI.umenu=false;UI.modal=null;UI.drawer=null;UI.rtab='todo';UI.role=false;UI.filter='';UI.float=null;UI.edit=null;render()}
  if(e.target.dataset.act==='filter'){UI.filter=e.target.value;render()}
});
document.addEventListener('submit',e=>{
  if(e.target.dataset.act==='tchat'){
    e.preventDefault();const inp=document.getElementById('t-in');const q=inp.value.trim();if(!q)return;
    const a=byId(UI.tchat.id);
    if(a.status!=='approved'&&a.owner===S.me)a.tests=(a.tests||0)+1;
    UI.tchat.msgs.push({r:'u',t:q},{r:'a',t:`（示意回覆）已依「${a.kb}」查詢。實際會由「${a.name}」依知識庫內容回答。`});
    render();document.getElementById('t-in')?.focus();return;
  }
  if(e.target.dataset.act==='fchat'){
    e.preventDefault();const inp=document.getElementById('f-in');const q=inp.value.trim();if(!q)return;
    const c=UI.float.chats.find(x=>x.id===UI.float.active)||UI.float.chats[0];const a=byId(c.id);
    if(a.status!=='approved'&&a.owner===S.me)a.tests=(a.tests||0)+1;
    c.msgs.push({r:'u',t:q},{r:'a',t:`（示意回覆）已依「${a.kb}」查詢。實際會由「${a.name}」依知識庫內容回答。`});
    render();document.getElementById('f-in')?.focus();return;
  }
  if(e.target.dataset.act!=='chat')return;
  e.preventDefault();
  const inp=document.getElementById('chat-in');const q=inp.value.trim();if(!q)return;
  const a=byId(UI.modal.id);
  const rt=document.getElementById('rej-reason');if(rt)UI.rejText=rt.value;
  UI.chat.push({r:'u',t:q});
  UI.chat.push({r:'a',t:`（${a.name} 測試回覆）已依「${a.kb}」查詢：這是原型的示意回答，實際會由這個 AI 助理依知識庫內容回覆。`});
  render();
});
render();
</script>
</body>
</html>
